[package]
name = "memo-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "memo"
path = "src/main.rs"

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.154"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
memo-core = { version = "0.1.0", path = "../memo-core" }
memo-harness = { version = "0.1.0", path = "../memo-harness" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
